<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>应用安装</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="应用安装">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/static/appicon.png">
<link rel="manifest" href="/install/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/i18n.js"></script>
<style>
  .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 48px 20px 64px; }
  .page-head { margin-bottom: 28px; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .head-brand { display: inline-flex; align-items: center; gap: 10px; }
  .head-brand .brand-mark { width: 32px; height: 32px; }
  .head-row .section-kicker { margin: 0; }
  .page-head h1 { font-size: 32px; margin-top: 6px; }
  .page-head .muted { display: block; margin-top: 8px; }
  .app-icon { width: 72px; height: 72px; flex: 0 0 auto; border: 1px solid var(--border); border-radius: 18px; background: var(--surface-muted); box-shadow: 0 12px 26px rgba(0, 0, 0, .1); object-fit: cover; }
  .app-title { font-size: 20px; font-weight: 650; letter-spacing: -.025em; }
  .app-line { color: var(--text-secondary); font-size: 13px; }
  .install-meta { margin: 18px 0; }
  .foot { margin-top: 28px; color: var(--text-tertiary); font-size: 12px; line-height: 1.6; }
  @media (min-width: 1024px) {
    .wrap { width: 60vw; min-width: 560px; max-width: none; }
  }
  @media (max-width: 700px) {
    .wrap { padding: 24px 16px 48px; }
    .page-head h1 { font-size: 25px; }
    .app-icon { width: 58px; height: 58px; border-radius: 15px; }
    .install-actions .button { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div class="ambient ambient-one" aria-hidden="true"></div>
<div class="ambient ambient-two" aria-hidden="true"></div>

<div class="wrap">
  <header class="page-head">
    <div class="head-row">
      <div class="head-brand">
        <span class="brand-mark" aria-hidden="true"><img src="/static/favicon.svg" alt="" width="32" height="32"></span>
        <p class="section-kicker">READY TO INSTALL</p>
      </div>
      <div class="head-actions">
        <a class="github-link" href="https://github.com/3zang/ios-auto-sign" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button class="lang-switch" type="button" data-i18n-skip aria-label="Switch to English">EN</button>
        <button class="theme-toggle" type="button" data-i18n-skip aria-label="主题：自动（跟随系统），点击切换" title="主题：自动（跟随系统）（点击切换到白天）">
          <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <g class="ico-light"><circle cx="12" cy="12" r="5"/><g stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></g></g>
            <path class="ico-dark" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            <path class="ico-auto" d="M12 2a10 10 0 1 0 0 20V2z"/>
          </svg>
          <span class="theme-toggle-label">自动</span>
        </button>
      </div>
    </div>
    <h1>应用安装</h1>
    <span class="muted">请在 iOS 设备的 Safari 中打开本页；仅显示当前登录账号可安装的应用。</span>
  </header>
  <div id="grid" class="card-grid"></div>
  <div id="empty" class="empty-state" hidden>暂无可安装的应用。请先在控制台勾选应用、上传证书并等待签名任务完成。</div>
  <div id="login-required" class="empty-state" hidden>安装数据已按账号隔离，请先<a class="link" href="/">登录控制台</a>后再打开本页。</div>
  <p class="foot">安装链接使用 itms-services 协议，请在 iOS 设备的 Safari 中打开；桌面浏览器点击不会触发安装。</p>
</div>

<dialog class="qr-dialog" id="qrDialog" aria-labelledby="qrDialogTitle">
  <div class="dialog-glow" aria-hidden="true"></div>
  <button class="dialog-close" id="closeQrButton" type="button" aria-label="关闭二维码">×</button>
  <div class="qr-dialog-content">
    <p class="section-kicker">SCAN TO INSTALL</p>
    <h2 id="qrDialogTitle">扫码安装</h2>
    <div class="qr-frame"><img id="qrImage" alt="安装二维码" width="280" height="280"></div>
    <h3 id="qrAppName"></h3>
    <p class="qr-version" id="qrAppVersion"></p>
    <p class="qr-hint">使用 iPhone 相机扫描二维码，在打开的提示中确认安装。</p>
    <button class="button button-secondary" id="qrCopyLink" type="button">复制安装链接</button>
  </div>
</dialog>

<script src="/static/qrcode.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var grid = $('#grid');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  }); }
  function tr(s) { return window.IASI18N ? window.IASI18N.t(s) : s; }
  function fmtTime(t) {
    try {
      var locale = window.IASI18N && window.IASI18N.lang === 'en' ? 'en-US' : 'zh-CN';
      return new Date(t).toLocaleString(locale);
    } catch (e) { return t || ''; }
  }
  function fmtSize(n) { return n ? (n / 1048576).toFixed(1) + ' MB' : '-'; }

  function makeQr(text) {
    if (typeof window.qrcode !== 'function') throw new Error(tr('二维码组件未加载'));
    var lib = window.qrcode;
    if (lib.stringToBytesFuncs && lib.stringToBytesFuncs['UTF-8']) {
      lib.stringToBytes = lib.stringToBytesFuncs['UTF-8'];
    }
    var qr = lib(0, 'M');
    qr.addData(text, 'Byte');
    qr.make();
    var n = qr.getModuleCount(), scale = 6, margin = 4;
    var size = (n + margin * 2) * scale;
    var canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#1d1d1f';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (qr.isDark(r, c)) ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
    }
    return canvas.toDataURL('image/png');
  }

  function closeQr() {
    var dlg = $('#qrDialog');
    if (typeof dlg.close === 'function' && dlg.open) dlg.close();
    else dlg.removeAttribute('open');
  }
  $('#closeQrButton').onclick = closeQr;
  $('#qrDialog').addEventListener('click', function (e) { if (e.target === $('#qrDialog')) closeQr(); });

  function openQr(app) {
    try { $('#qrImage').src = makeQr(app.install_url || ''); }
    catch (e) { alert(tr(e.message)); return; }
    $('#qrImage').alt = (app.name || '应用') + ' 的安装二维码';
    $('#qrAppName').textContent = app.name || '';
    $('#qrAppVersion').textContent = '版本 ' + (app.version || '-');
    $('#qrCopyLink').onclick = function () {
      var ta = document.createElement('textarea');
      ta.value = app.install_url || '';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { /* ignore */ }
      document.body.removeChild(ta);
      $('#qrCopyLink').textContent = '已复制链接';
      setTimeout(function () { $('#qrCopyLink').textContent = '复制安装链接'; }, 1800);
    };
    var dlg = $('#qrDialog');
    if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); }
    else dlg.setAttribute('open', '');
  }

  // Reflect this instance's name on the home-screen label and document title,
  // so "Add to Home Screen" does not fall back to the generic product name.
  fetch('/api/config/public').then(function (r) { return r.ok ? r.json() : null; }).then(function (cfg) {
    var name = cfg && cfg.site_title ? cfg.site_title : '应用安装';
    document.title = name + ' 应用安装';
    var mt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if (mt) mt.setAttribute('content', name.length > 12 ? name.slice(0, 12) : name);
    var h1 = document.querySelector('.page-head h1');
    if (h1) h1.textContent = name + ' 应用安装';
  }).catch(function () { /* keep defaults */ });

  fetch('/api/install/apps').then(function (r) {
    if (r.status === 401) { $('#login-required').hidden = false; return null; }
    return r.json();
  }).then(function (list) {
    if (!list) return;
    if (!Array.isArray(list) || !list.length) { $('#empty').hidden = false; return; }
    list.sort(function (a, b) { return new Date(b.updated_at) - new Date(a.updated_at); });
    grid.innerHTML = list.map(function (a) {
      var icon = a.icon_url ? '<img class="app-icon" src="' + esc(a.icon_url) + '" alt="">'
                           : '<img class="app-icon" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="">';
      return '<div class="card">' +
        '<div class="card-head">' + icon + '<div><div class="app-title" data-i18n-skip>' + esc(a.name) + '</div>' +
          '<div class="app-line mono">' + esc(a.bundle_id) + '</div></div></div>' +
        '<div class="install-meta">' +
          '<div>版本 <b>' + esc(a.version) + '</b></div>' +
          '<div>更新时间 <b>' + esc(fmtTime(a.updated_at)) + '</b></div>' +
          '<div>大小 <b>' + esc(fmtSize(a.size)) + '</b></div>' +
        '</div>' +
        '<div class="inline install-actions">' +
          '<a class="button button-primary" href="' + esc(a.install_url) + '">安装</a>' +
          '<button class="button button-qr" type="button" data-qr="' + esc(a.id) + '">' +
            '<span class="qr-mini" aria-hidden="true"></span>二维码</button>' +
        '</div></div>';
    }).join('');
    Array.prototype.forEach.call(grid.querySelectorAll('button[data-qr]'), function (b) {
      b.onclick = function () {
        var item = list.find(function (x) { return x.id === b.dataset.qr; });
        if (item) openQr(item);
      };
    });
  }).catch(function () { $('#empty').hidden = false; });
})();
</script>
</body>
</html>
