<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>iOS 自动签名控制台</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AutoSign">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/static/appicon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/i18n.js"></script>
</head>
<body>
<div class="ambient ambient-one" aria-hidden="true"></div>
<div class="ambient ambient-two" aria-hidden="true"></div>

<div id="auth-view" class="auth-wrap" hidden>
  <div class="auth-card">
    <img class="auth-logo" src="/static/favicon.svg" alt="" width="56" height="56" aria-hidden="true">
    <p class="section-kicker">LOCAL OTA SIGNING</p>
    <h1 data-i18n-skip>iOS 自动签名</h1>
    <p class="auth-subtitle">签名、分发，一站式控制台</p>
    <div class="auth-seg" role="tablist" aria-label="账号操作">
      <button type="button" data-mode="login" class="active" role="tab">登录</button>
      <button type="button" data-mode="register" role="tab">注册</button>
    </div>
    <form id="auth-form">
      <label>用户名<input name="username" autocomplete="username" placeholder="请输入用户名" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
      <p id="auth-hint" class="auth-hint"></p>
      <button id="auth-submit" type="submit" class="primary">登录</button>
    </form>
    <p class="auth-foot">请在 iOS 设备的 Safari 中打开安装页完成安装</p>
    <div class="auth-lang-row"><button class="lang-switch" type="button" data-i18n-skip>EN</button></div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><img src="/static/favicon.svg" alt="" width="30" height="30"></span>
      <span class="brand-copy"><span id="site-title" data-i18n-skip>iOS 自动签名</span><span class="brand-version" id="app-version" data-i18n-skip>__VERSION__</span><small>LOCAL OTA SIGNING</small></span>
    </div>
    <div class="spacer"></div>
    <span id="who" class="muted" data-i18n-skip></span>
    <a class="github-link" href="https://github.com/3zang/ios-auto-sign" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <button class="lang-switch" id="langToggle" type="button" data-i18n-skip aria-label="Switch to English">EN</button>
    <button class="theme-toggle" id="themeToggle" type="button" data-i18n-skip aria-label="主题：自动（跟随系统），点击切换" title="主题：自动（跟随系统）（点击切换到白天）">
      <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <g class="ico-light"><circle cx="12" cy="12" r="5"/><g stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></g></g>
        <path class="ico-dark" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        <path class="ico-auto" d="M12 2a10 10 0 1 0 0 20V2z"/>
      </svg>
      <span class="theme-toggle-label">自动</span>
    </button>
    <button id="logout" class="ghost">退出</button>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="overview">概览</button>
    <button class="tab" data-tab="sources">订阅源</button>
    <button class="tab" data-tab="apps">应用与配置</button>
    <button class="tab" data-tab="icons">图标库</button>
    <button class="tab" data-tab="certs">证书</button>
    <button class="tab" data-tab="jobs">任务与产物</button>
    <button class="tab" data-tab="install">安装</button>
    <button class="tab" data-tab="settings">设置中心</button>
  </nav>
  <main>
    <section class="panel" id="panel-overview"></section>
    <section class="panel" id="panel-sources" hidden></section>
    <section class="panel" id="panel-apps" hidden></section>
    <section class="panel" id="panel-icons" hidden></section>
    <section class="panel" id="panel-certs" hidden></section>
    <section class="panel" id="panel-jobs" hidden></section>
    <section class="panel" id="panel-install" hidden></section>
    <section class="panel" id="panel-settings" hidden></section>
  </main>
</div>

<dialog class="qr-dialog" id="qrDialog" aria-labelledby="qrDialogTitle">
  <div class="dialog-glow" aria-hidden="true"></div>
  <button class="dialog-close" id="closeQrButton" type="button" aria-label="关闭二维码">×</button>
  <div class="qr-dialog-content">
    <p class="section-kicker">SCAN TO INSTALL</p>
    <h2 id="qrDialogTitle">扫码安装</h2>
    <div class="qr-frame"><img id="qrImage" alt="安装二维码" width="280" height="280"></div>
    <h3 id="qrAppName" data-i18n-skip></h3>
    <p class="qr-version" id="qrAppVersion"></p>
    <p class="qr-hint">使用 iPhone 相机扫描二维码，在打开的提示中确认安装。二维码内容为该应用的 OTA 安装链接。</p>
    <button class="button button-secondary" id="qrCopyLink" type="button">复制安装链接</button>
  </div>
</dialog>

<dialog class="qr-dialog icon-dialog" id="iconDialog" aria-labelledby="iconDialogTitle">
  <div class="dialog-glow" aria-hidden="true"></div>
  <button class="dialog-close" id="closeIconButton" type="button" aria-label="关闭预览">×</button>
  <div class="icon-preview-content">
    <p class="section-kicker">ICON PREVIEW</p>
    <h2 id="iconDialogTitle">图标预览</h2>
    <img id="iconPreviewImage" alt="图标预览" width="180" height="180">
    <h3 id="iconPreviewName" data-i18n-skip></h3>
    <p class="icon-preview-url mono" id="iconPreviewUrl" data-i18n-skip></p>
    <a class="button button-secondary" id="iconOpenLink" href="#" target="_blank" rel="noopener">打开原图</a>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="/static/qrcode.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
